<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>나락의 징검다리</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0b0e1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
  }
  body {
    touch-action: none;            /* 터치 시 확대/스크롤 방지 */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    image-rendering: auto;
  }

  /* ===== 모바일 터치 버튼 (터치 기기에서만 표시) ===== */
  #touch { display: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    background: rgba(20, 16, 50, 0.35);
    color: rgba(255, 255, 255, 0.85);
    font: bold 26px "Segoe UI", "Malgun Gothic", sans-serif;
    backdrop-filter: blur(2px);
    pointer-events: none;          /* 입력은 #touch 영역에서 일괄 처리 */
  }
  .tbtn.on {
    background: rgba(120, 180, 255, 0.45);
    border-color: rgba(255, 255, 255, 0.8);
  }
  #btnLeft  { left:  calc(18px + env(safe-area-inset-left));  bottom: calc(18px + env(safe-area-inset-bottom)); width: 78px; height: 78px; }
  #btnRight { left:  calc(110px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 78px; height: 78px; }
  #btnJump  { right: calc(22px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 96px; height: 96px; font-size: 20px; }
  #btnReset { right: calc(14px + env(safe-area-inset-right)); top: calc(56px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 20px; }

  /* 세로 화면이면 가로로 돌리라는 안내 */
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #0b0e1a;
    color: #fff;
    font: bold 20px "Segoe UI", "Malgun Gothic", sans-serif;
    text-align: center;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #rotate .icon { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) {
    body.touch #rotate { display: flex; }
  }
  #btnMenu { right: calc(66px + env(safe-area-inset-right)); top: calc(56px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 20px; }
  body.menu-open #touch { display: none; }

  /* ===== 메인 메뉴 (캐릭터 꾸미기 + 스테이지 선택) ===== */
  #menu {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(8, 6, 24, 0.72);
    backdrop-filter: blur(3px);
    color: #fff;
    overflow-y: auto;
    touch-action: pan-y;
  }
  #menu[hidden] { display: none; }
  .menu-panel {
    width: min(880px, 100%);
    margin: auto;
  }
  .menu-title {
    text-align: center;
    font-size: clamp(26px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffe066;
    text-shadow: 0 3px 0 #7a1414, 0 0 24px rgba(255, 90, 60, 0.6);
    margin-bottom: 4px;
  }
  .menu-sub { text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 14px; }
  .menu-cols { display: flex; gap: 14px; flex-wrap: wrap; }
  .menu-card {
    flex: 1 1 300px;
    background: rgba(30, 24, 70, 0.75);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
  }
  .menu-card h2 { font-size: 16px; margin-bottom: 10px; color: #cfd6ff; }
  .menu-card h3 { font-size: 13px; margin: 10px 0 6px; color: rgba(255,255,255,0.7); font-weight: 600; }
  .char-row { display: flex; gap: 12px; align-items: flex-start; }
  #preview { width: 96px; height: 96px; flex: none; border-radius: 12px; background: rgba(0,0,0,0.25); }
  .char-opts { flex: 1; min-width: 0; }
  .swatches, .patterns { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid transparent; cursor: pointer;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25);
  }
  .swatch.sel { border-color: #fff; }
  .pat {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(0,0,0,0.25); border: 2px solid transparent; border-radius: 10px;
    padding: 4px 4px 3px; cursor: pointer; color: #fff; font: 11px "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .pat canvas { width: 34px; height: 34px; }
  .pat.sel { border-color: #ffe066; background: rgba(255, 224, 102, 0.12); }
  .stages { display: flex; flex-direction: column; gap: 8px; }
  .stage {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.12); color: #fff;
    font: 15px "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .stage:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: rgba(255,224,102,0.6); }
  .stage .num {
    width: 32px; height: 32px; flex: none; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: #5dff8f; color: #0b2a16; font-weight: 800;
  }
  .stage .name { flex: 1; font-weight: 700; }
  .stage .best { font-size: 12px; color: rgba(255,255,255,0.65); }
  .stage:disabled { cursor: not-allowed; opacity: 0.45; }
  .stage:disabled .num { background: #555a70; color: #ccc; }
  .menu-hint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch">
  <div class="tbtn" id="btnLeft" data-key="ArrowLeft">◀</div>
  <div class="tbtn" id="btnRight" data-key="ArrowRight">▶</div>
  <div class="tbtn" id="btnJump" data-key="Space">점프</div>
  <div class="tbtn" id="btnReset" data-action="reset">↺</div>
  <div class="tbtn" id="btnMenu" data-action="menu">☰</div>
</div>
<div id="menu" hidden>
  <div class="menu-panel">
    <div class="menu-title">나락의 징검다리</div>
    <div class="menu-sub">하드코어 점프맵</div>
    <div class="menu-cols">
      <div class="menu-card">
        <h2>캐릭터 꾸미기</h2>
        <div class="char-row">
          <canvas id="preview"></canvas>
          <div class="char-opts">
            <h3 style="margin-top:0">색깔</h3>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>
        <h3>무늬</h3>
        <div class="patterns" id="patterns"></div>
      </div>
      <div class="menu-card">
        <h2>스테이지</h2>
        <div class="stages" id="stageList"></div>
      </div>
    </div>
    <div class="menu-hint" id="menuHint"></div>
  </div>
</div>
<div id="rotate"><div class="icon">📱</div>화면을 가로로 돌려주세요</div>

<script>
// 오프라인 플레이: 한 번 접속하면 게임 파일을 저장해 두고 인터넷 없이도 실행
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
<script>
(() => {
  'use strict';

  // ===================== 기본 설정 =====================
  const VIEW_W = 960;            // 논리 화면 크기
  const VIEW_H = 540;
  const STEP = 1 / 120;          // 고정 물리 스텝 (초)

  // 물리 상수
  const GRAVITY = 1900;
  const MAX_FALL = 1000;
  const MOVE_SPEED = 280;
  const GROUND_ACCEL = 2600;
  const AIR_ACCEL = 1600;
  const GROUND_FRICTION = 2400;
  const AIR_FRICTION = 500;
  const JUMP_VELOCITY = 650;
  const JUMP_CUT_GRAVITY = 2.3;  // 점프 키를 떼면 더 빨리 떨어짐 (가변 점프 높이)
  const FALL_GRAVITY = 1.15;
  const COYOTE_TIME = 0.08;      // 발판에서 막 벗어난 직후 짧은 유예
  const JUMP_BUFFER = 0.1;       // 착지 직전 누른 점프를 기억

  // 함정 발판 타이밍
  const CRUMBLE_DELAY = 1.0;     // 밟은 뒤 부서지기까지 (이 동안 붉게 변하며 흔들림)
  const CRUMBLE_RESTORE = 3.0;   // 부서진 뒤 복구되기까지

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===================== 화면 크기 대응 =====================
  let renderScale = 1;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
    renderScale = scale * dpr;
    canvas.width = Math.floor(VIEW_W * renderScale);
    canvas.height = Math.floor(VIEW_H * renderScale);
    canvas.style.width = Math.floor(VIEW_W * scale) + 'px';
    canvas.style.height = Math.floor(VIEW_H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ===================== 스테이지 데이터 =====================
  // solid: 사방이 막힌 블록 / oneway: 위에서만 밟을 수 있는 발판
  // spikes: 바닥 위에 놓이는 가시 (y = 가시가 놓인 면의 높이) / lava: 용암 영역
  // 새 스테이지는 이 배열에 하나 더 추가하면 메뉴에 자동으로 나타남
  // (make()는 매번 새 객체를 만들어서, 다시 시작할 때 발판 상태가 깨끗하게 초기화됨)
  const G = 820; // 1스테이지 기본 바닥 높이

  const STAGES = [
    {
      name: '첫 걸음',
      worldW: 3500, worldH: 900,
      make: () => ({
        start: { x: 60, y: G - 36 },
        solids: [
          // 기본 바닥
          { x: 0,    y: G,   w: 600,  h: 80 },
          { x: 740,  y: G,   w: 420,  h: 80 },
          { x: 1700, y: G,   w: 400,  h: 80 },
          // 뛰어넘어야 하는 벽 블록
          { x: 1060, y: G - 60, w: 60, h: 60 },
          // 상층부 블록 (가운데 가시가 있음)
          { x: 2680, y: 340, w: 160, h: 24 },
          // 도착 지점 블록
          { x: 3240, y: 160, w: 200, h: 24 },
        ],
        oneways: [
          { x: 220,  y: 720, w: 120 },
          { x: 880,  y: 720, w: 140 },
          // 용암 바다 위 징검다리 (가운데는 움직이는 발판)
          { x: 1200, y: 740, w: 100 },
          { x: 1580, y: 740, w: 100 },
          // 지그재그 오르막
          { x: 1820, y: 720, w: 100 },
          { x: 1800, y: 540, w: 110 },
          { x: 2130, y: 380, w: 120 },
          // 상층 루트
          { x: 2500, y: 320, w: 90 },
        ],
        // 함정 발판: 원웨이 발판처럼 위에서만 밟을 수 있음
        // 밟으면 CRUMBLE_DELAY초 뒤 부서지고, CRUMBLE_RESTORE초 뒤 원래대로 복구
        crumbles: [
          { x: 1960, y: 630, w: 100 },
          { x: 1960, y: 450, w: 100 },
          { x: 3080, y: 200, w: 100 },
        ],
        // 움직이는 발판: 기준 위치(bx, by)에서 sin 곡선으로 왕복 (ax: 가로 폭, ay: 세로 폭, period: 왕복 주기[초])
        // 위에서만 밟을 수 있고, 올라타면 발판과 함께 이동
        movers: [
          { bx: 1390, by: 700, w: 100, ax: 70, ay: 0,  period: 3.0, phase: 0 },
          { bx: 2330, by: 380, w: 90,  ax: 80, ay: 0,  period: 3.2, phase: 1 },
          { bx: 2900, by: 260, w: 100, ax: 0,  ay: 70, period: 3.5, phase: 0 },
        ],
        // 체크포인트: 깃발에 닿으면 활성화, 죽으면 마지막 체크포인트에서 부활 (y = 깃발이 서 있는 면의 높이)
        checkpoints: [
          { x: 790,  y: G },
          { x: 1720, y: G },
          { x: 2170, y: 380 },
          { x: 2690, y: 340 },
        ],
        spikes: [
          { x: 380,  y: G,   w: 40 },
          { x: 900,  y: G,   w: 80 },
          { x: 1950, y: G,   w: 140 },
          { x: 2740, y: 340, w: 40 },
          { x: 2525, y: 320, w: 20 },
        ],
        lava: [
          { x: 600,  y: 850, w: 140,  h: 50 },
          { x: 1160, y: 850, w: 540,  h: 50 },
        ],
        // 나락: 바닥이 없는 구간 (떨어지면 사망 없이 마지막 체크포인트로 구조됨)
        abyss: [
          { x: 2100, w: 1400 },
        ],
        goal: { x: 3330, y: 100, w: 40, h: 60 },
      }),
    },
    {
      name: '무너지는 다리',
      worldW: 3600, worldH: 900,
      sky: ['#05081a', '#13214a', '#26386a', '#3e3466'],
      make: () => ({
        start: { x: 60, y: 700 - 36 },
        solids: [
          { x: 0,    y: 700, w: 300, h: 200 },   // 출발 바위
          { x: 1460, y: 640, w: 240, h: 260 },   // 가운데 섬
          { x: 3160, y: 360, w: 440, h: 540 },   // 도착 절벽
        ],
        oneways: [
          { x: 940,  y: 620, w: 80 },
          { x: 2440, y: 520, w: 100 },
        ],
        // 대부분이 함정 발판인 다리: 멈추지 말고 건너야 함
        crumbles: [
          { x: 400,  y: 680, w: 90 },
          { x: 580,  y: 640, w: 90 },
          { x: 760,  y: 600, w: 90 },
          { x: 1800, y: 600, w: 80 },
          { x: 1960, y: 560, w: 80 },
          { x: 2120, y: 600, w: 80 },
          { x: 2280, y: 560, w: 80 },
          { x: 2820, y: 420, w: 80 },
          { x: 3000, y: 380, w: 80 },
        ],
        movers: [
          { bx: 1170, by: 620, w: 90, ax: 90, ay: 0,  period: 3.0, phase: 0 },
          { bx: 2640, by: 480, w: 90, ax: 0,  ay: 80, period: 3.0, phase: 0 },
        ],
        checkpoints: [
          { x: 1480, y: 640 },
          { x: 2460, y: 520 },
        ],
        spikes: [
          { x: 1580, y: 640, w: 40 },
          { x: 3280, y: 360, w: 40 },
        ],
        lava: [],
        abyss: [
          { x: 0, w: 3600 },
        ],
        goal: { x: 3500, y: 300, w: 40, h: 60 },
      }),
    },
    {
      name: '나락의 심장',
      worldW: 1600, worldH: 1800,
      sky: ['#140306', '#340a14', '#5e161c', '#9a3a1c'],
      make: () => ({
        start: { x: 60, y: 1700 - 36 },
        solids: [
          { x: 0,    y: 1700, w: 400, h: 100 },
          { x: 1200, y: 1700, w: 400, h: 100 },
          { x: 700,  y: 820,  w: 160, h: 24 },   // 중간 쉼터 (가시 넘어 체크포인트)
          { x: 860,  y: 260,  w: 320, h: 24 },   // 꼭대기 도착 지점
        ],
        // 아래에서 위로 올라가는 수직 스테이지
        oneways: [
          { x: 200,  y: 1620, w: 100 },
          { x: 60,   y: 1540, w: 100 },
          { x: 420,  y: 1400, w: 90 },
          { x: 900,  y: 1320, w: 100 },
          { x: 1440, y: 1110, w: 100 },
          { x: 1300, y: 1030, w: 90 },
          { x: 40,   y: 480,  w: 100 },
          { x: 200,  y: 400,  w: 90 },
        ],
        crumbles: [
          { x: 220,  y: 1460, w: 100 },
          { x: 1080, y: 1250, w: 90 },
          { x: 1260, y: 1180, w: 90 },
          { x: 1120, y: 960,  w: 90 },
          { x: 940,  y: 890,  w: 90 },
          { x: 380,  y: 620,  w: 90 },
          { x: 200,  y: 550,  w: 90 },
          { x: 380,  y: 330,  w: 90 },
        ],
        movers: [
          { bx: 640, by: 1360, w: 90, ax: 80, ay: 0,  period: 3.0, phase: 0 },
          { bx: 560, by: 700,  w: 90, ax: 0,  ay: 60, period: 2.8, phase: 0 },
          { bx: 600, by: 300,  w: 90, ax: 70, ay: 0,  period: 2.6, phase: 0 },
        ],
        checkpoints: [
          { x: 920, y: 1320 },
          { x: 705, y: 820 },
          { x: 50,  y: 480 },
        ],
        spikes: [
          { x: 750, y: 820, w: 30 },
          { x: 960, y: 260, w: 40 },
        ],
        lava: [
          { x: 400, y: 1720, w: 800, h: 80 },
        ],
        abyss: [],
        goal: { x: 1110, y: 200, w: 40, h: 60 },
      }),
    },
  ];

  let stageIndex = 0;
  let level = null;
  let WORLD_W = 0;
  let WORLD_H = 0;
  let spikeBoxes = [];

  const SPIKE_H = 20;
  // 가시의 실제 판정 박스 (그림보다 조금 작게 해서 억울한 판정 방지)
  const makeSpikeBoxes = () => level.spikes.map(s => ({
    x: s.x + 4, y: s.y - SPIKE_H + 8, w: s.w - 8, h: SPIKE_H - 8,
  }));

  const CP_H = 56;
  const checkpointBox = c => ({ x: c.x, y: c.y - CP_H, w: 24, h: CP_H });

  // 움직이는 발판 위치 갱신 (dx, dy = 이번 스텝 이동량 → 탄 플레이어도 같이 이동)
  function updateMovers() {
    for (const m of level.movers) {
      const t = (time * Math.PI * 2) / m.period + m.phase;
      const nx = m.bx + Math.sin(t) * m.ax;
      const ny = m.by + Math.sin(t) * m.ay;
      m.prevY = m.y === undefined ? ny : m.y;
      m.dx = m.x === undefined ? 0 : nx - m.x;
      m.dy = ny - m.prevY;
      m.x = nx;
      m.y = ny;
    }
  }

  // 함정 발판 상태 진행: idle → (밟힘) shaking → broken → idle
  function updateCrumbles(dt) {
    for (const c of level.crumbles) {
      if (c.state === 'shaking') {
        c.timer += dt;
        if (c.timer >= CRUMBLE_DELAY) {
          c.state = 'broken';
          c.timer = 0;
          shakeTimer = Math.max(shakeTimer, 0.12);
          // 부서진 파편이 아래로 떨어지는 효과
          for (let i = 0; i < 14; i++) {
            particles.push({
              x: c.x + Math.random() * c.w,
              y: c.y + 6,
              vx: (Math.random() - 0.5) * 120,
              vy: -Math.random() * 120,
              life: 0.8 + Math.random() * 0.5,
              max: 1.3,
              size: 5 + Math.random() * 5,
              color: '#c83c3c',
            });
          }
        }
      } else if (c.state === 'broken') {
        c.timer += dt;
        if (c.timer >= CRUMBLE_RESTORE) {
          c.state = 'idle';
          c.timer = 0;
        }
      }
    }
  }

  function resetCrumbles() {
    for (const c of level.crumbles) {
      c.state = 'idle';
      c.timer = 0;
    }
  }

  // ===================== 저장 데이터 (캐릭터, 진행도, 기록) =====================
  const SAVE_KEY = 'narak-jumpmap-save';
  const save = { skin: 0, pattern: 'none', unlocked: 1, best: {}, last: 0 };
  try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (_) { /* 저장소 사용 불가 */ }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) { /* 무시 */ }
  }

  // ===================== 캐릭터 꾸미기 =====================
  // body: 몸 색 / light: 윗부분 하이라이트 / dark: 외곽선 / pat: 무늬 색 / accent: 별 무늬 색
  const SKINS = [
    { name: '파랑', body: '#4fa3ff', light: '#8cc6ff', dark: '#1b2a5c', pat: 'rgba(16, 40, 110, 0.35)', accent: '#ffe066' },
    { name: '빨강', body: '#ff5a5a', light: '#ff9c9c', dark: '#5c1b1b', pat: 'rgba(110, 10, 10, 0.35)', accent: '#ffe066' },
    { name: '초록', body: '#4fd67a', light: '#9cf0b5', dark: '#1b5c33', pat: 'rgba(10, 80, 30, 0.35)',  accent: '#ffe066' },
    { name: '노랑', body: '#ffd23f', light: '#ffe98c', dark: '#6b5410', pat: 'rgba(120, 80, 0, 0.35)',  accent: '#ff5a3c' },
    { name: '보라', body: '#a974ff', light: '#d2b5ff', dark: '#3a1b6b', pat: 'rgba(50, 10, 110, 0.35)', accent: '#ffe066' },
    { name: '분홍', body: '#ff7ac8', light: '#ffb8e2', dark: '#6b1b4a', pat: 'rgba(120, 10, 70, 0.3)',  accent: '#fff3a0' },
    { name: '주황', body: '#ff9a3c', light: '#ffc78c', dark: '#6b3a10', pat: 'rgba(120, 50, 0, 0.35)',  accent: '#fff3a0' },
    { name: '하양', body: '#e8ecf5', light: '#ffffff', dark: '#4a5068', pat: 'rgba(60, 70, 110, 0.3)',  accent: '#ff7ac8' },
    { name: '검정', body: '#3a3f52', light: '#6a7088', dark: '#0e1018', pat: 'rgba(255, 255, 255, 0.28)', accent: '#ffe066' },
  ];
  const PATTERNS = [
    { id: 'none',    name: '없음' },
    { id: 'stripes', name: '줄무늬' },
    { id: 'dots',    name: '물방울' },
    { id: 'checker', name: '체크' },
    { id: 'zigzag',  name: '지그재그' },
    { id: 'star',    name: '별' },
    { id: 'belly',   name: '배' },
  ];
  const curSkin = () => SKINS[save.skin] || SKINS[0];

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  // 무늬는 몸의 아래쪽 절반(옷처럼)에만 그려서 눈을 가리지 않음
  function drawPattern(c, x, y, w, h, pattern, skin) {
    c.fillStyle = skin.pat;
    c.strokeStyle = skin.pat;
    const top = y + h * 0.55;
    if (pattern === 'stripes') {
      for (let yy = top; yy < y + h; yy += 7) c.fillRect(x, yy, w, 3.5);
    } else if (pattern === 'dots') {
      for (const [px, py] of [[0.2, 0.64], [0.55, 0.74], [0.85, 0.6], [0.33, 0.9], [0.75, 0.94], [0.05, 0.86]]) {
        c.beginPath();
        c.arc(x + w * px, y + h * py, w * 0.1, 0, Math.PI * 2);
        c.fill();
      }
    } else if (pattern === 'checker') {
      const cell = w / 4;
      for (let j = 0; top + j * cell < y + h; j++) {
        for (let i = 0; i < 4; i++) if ((i + j) % 2 === 0) c.fillRect(x + i * cell, top + j * cell, cell, cell);
      }
    } else if (pattern === 'zigzag') {
      c.lineWidth = w * 0.11;
      for (const row of [0.64, 0.86]) {
        c.beginPath();
        for (let i = 0; i <= 6; i++) {
          const px = x + (w / 6) * i;
          const py = y + h * row + (i % 2 ? -w * 0.08 : w * 0.08);
          if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.stroke();
      }
    } else if (pattern === 'star') {
      const cx = x + w / 2, cy = y + h * 0.76, R = w * 0.24, r = R * 0.45;
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        const rad = i % 2 ? r : R;
        c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
      }
      c.closePath();
      c.fillStyle = skin.accent;
      c.fill();
    } else if (pattern === 'belly') {
      c.fillStyle = 'rgba(255, 255, 255, 0.55)';
      c.beginPath();
      c.ellipse(x + w / 2, y + h * 0.8, w * 0.3, h * 0.2, 0, 0, Math.PI * 2);
      c.fill();
    }
  }

  // 게임 화면과 메뉴 미리보기에서 같이 쓰는 캐릭터 그리기
  function drawCharacter(c, x, y, w, h, facing, blink, skin, pattern) {
    c.fillStyle = skin.dark;
    rr(c, x - 2, y - 2, w + 4, h + 4, 8);
    c.fill();
    c.fillStyle = skin.body;
    rr(c, x, y, w, h, 6);
    c.fill();
    c.save();
    rr(c, x, y, w, h, 6);
    c.clip();
    drawPattern(c, x, y, w, h, pattern, skin);
    c.restore();
    c.fillStyle = skin.light;
    rr(c, x + 3, y + 3, w - 6, 8, 4);
    c.fill();

    // 눈
    const eyeY = y + h * 0.35;
    const lookX = facing * 3;
    c.fillStyle = '#fff';
    if (blink) {
      c.fillRect(x + w * 0.25 + lookX - 3, eyeY + 4, 7, 2);
      c.fillRect(x + w * 0.62 + lookX - 3, eyeY + 4, 7, 2);
    } else {
      c.fillRect(x + w * 0.25 + lookX - 3, eyeY, 7, 9);
      c.fillRect(x + w * 0.62 + lookX - 3, eyeY, 7, 9);
      c.fillStyle = '#10163a';
      c.fillRect(x + w * 0.25 + lookX + facing * 1.5 - 1, eyeY + 2, 4, 6);
      c.fillRect(x + w * 0.62 + lookX + facing * 1.5 - 1, eyeY + 2, 4, 6);
    }
    // 볼 홍조
    c.fillStyle = 'rgba(255, 120, 160, 0.45)';
    c.fillRect(x + w * 0.12 + lookX, eyeY + 11, 5, 3);
    c.fillRect(x + w * 0.78 + lookX - 4, eyeY + 11, 5, 3);
  }

  // ===================== 입력 처리 =====================
  const keys = new Set();
  let jumpPressedAt = -Infinity; // 점프 버퍼용

  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  const BLOCKED = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

  window.addEventListener('keydown', e => {
    if (BLOCKED.includes(e.code)) e.preventDefault();
    if (state === 'menu') {
      if (e.code === 'Enter') startStage(Math.min(save.last, save.unlocked - 1));
      return;
    }
    if (JUMP_KEYS.includes(e.code) && !e.repeat) jumpPressedAt = time;
    if (e.code === 'Enter' && state === 'dead') respawn();          // 마지막 체크포인트에서 부활
    if (e.code === 'Enter' && state === 'clear') nextStage();       // 다음 스테이지 (마지막이면 메뉴)
    if (e.code === 'KeyR' && !e.repeat) resetGame();                // 이 스테이지 처음부터
    if (e.code === 'Escape') openMenu();
    keys.add(e.code);
  });
  window.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  // ===================== 모바일 터치 입력 =====================
  // 손가락마다(pointerId) 어떤 버튼 위에 있는지 추적 → 버튼 사이를 미끄러져도 바로 전환되고 멀티터치(이동+점프)도 가능
  let isTouch = window.matchMedia('(pointer: coarse)').matches;
  const touchButtons = [...document.querySelectorAll('#touch .tbtn')];
  const fingers = new Map(); // pointerId -> 버튼 요소

  function enableTouchUI() {
    isTouch = true;
    document.body.classList.add('touch');
  }
  if (isTouch) enableTouchUI();

  // 가로 고정 + 전체화면 (지원하는 브라우저만, 실패해도 무시)
  let triedFullscreen = false;
  function tryFullscreen() {
    if (triedFullscreen) return;
    triedFullscreen = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try {
      Promise.resolve(req.call(el))
        .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
        .catch(() => {});
    } catch (_) { /* 미지원 */ }
  }

  function buttonAt(x, y) {
    for (const b of touchButtons) {
      const r = b.getBoundingClientRect();
      // 손가락이 살짝 벗어나도 인식되도록 판정을 넓게
      const pad = 14;
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return b;
    }
    return null;
  }

  function pressButton(b) {
    b.classList.add('on');
    if (b.dataset.action === 'reset') { resetGame(); return; }
    if (b.dataset.action === 'menu') { openMenu(); return; }
    const code = b.dataset.key;
    if (JUMP_KEYS.includes(code)) jumpPressedAt = time;
    keys.add(code);
  }

  function releaseButton(b) {
    // 다른 손가락이 같은 버튼을 누르고 있으면 유지
    for (const other of fingers.values()) if (other === b) return;
    b.classList.remove('on');
    if (b.dataset.key) keys.delete(b.dataset.key);
  }

  function setFinger(id, b) {
    const prev = fingers.get(id) || null;
    if (prev === b) return;
    if (b) fingers.set(id, b); else fingers.delete(id);
    if (prev) releaseButton(prev);
    if (b) pressButton(b);
  }

  window.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    if (!isTouch) enableTouchUI();
    tryFullscreen();
    if (state === 'menu') return;    // 메뉴에서는 일반 버튼 클릭으로 처리
    e.preventDefault();
    const b = buttonAt(e.clientX, e.clientY);
    if (b) {
      setFinger(e.pointerId, b);
    } else if (state === 'dead') {
      respawn();                     // 버튼 밖을 터치하면 체크포인트에서 다시 시작
    } else if (state === 'clear') {
      nextStage();
    }
  }, { passive: false });
  window.addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch' || !fingers.has(e.pointerId)) return;
    const b = buttonAt(e.clientX, e.clientY);
    // 다시하기/메뉴 버튼은 미끄러져 들어와서 눌리지 않도록 처음 누를 때만 인정
    setFinger(e.pointerId, b && b.dataset.action ? null : b);
  });
  const endFinger = e => { if (e.pointerType === 'touch') setFinger(e.pointerId, null); };
  window.addEventListener('pointerup', endFinger);
  window.addEventListener('pointercancel', endFinger);
  window.addEventListener('contextmenu', e => e.preventDefault());

  const isLeft  = () => keys.has('ArrowLeft') || keys.has('KeyA');
  const isRight = () => keys.has('ArrowRight') || keys.has('KeyD');
  const isJumpHeld = () => JUMP_KEYS.some(k => keys.has(k));

  // ===================== 게임 상태 =====================
  let state = 'menu';    // 'menu' | 'playing' | 'dead' | 'clear'
  let time = 0;          // 전체 경과 시간 (애니메이션용)
  let runTime = 0;       // 이번 도전 기록
  let deaths = 0;
  let particles = [];
  let stateTimer = 0;
  let currentCp = null;  // 마지막으로 활성화한 체크포인트
  let toastText = '';
  let toastTimer = 0;
  let flashTimer = 0;    // 낙하 구조 시 화면 번쩍임
  let shakeTimer = 0;    // 화면 흔들림
  let trail = [];        // 빠르게 움직일 때 플레이어 잔상

  // 배경 연출용 데이터 (인덱스로 생성해서 매번 같은 모양)
  const bgRuins = Array.from({ length: 40 }, (_, i) => ({
    x: i * 170 + ((i * 53) % 60),
    w: 22 + ((i * 31) % 26),
    h: 110 + ((i * 97) % 190),
    broken: i % 3 === 0,
  }));
  const embers = Array.from({ length: 60 }, (_, i) => ({
    x: (i * 211) % (VIEW_W * 1.6),
    y: (i * 89) % VIEW_H,
    vy: 14 + ((i * 7) % 24),
    size: 1 + ((i * 13) % 3),
    ph: i,
  }));

  const player = {
    x: 0, y: 0, w: 28, h: 36,
    vx: 0, vy: 0,
    onGround: false,
    ride: null,          // 현재 올라타 있는 움직이는 발판
    coyote: 0,
    facing: 1,
    squash: 0,
  };

  const camera = { x: 0, y: 0 };

  // 체크포인트(없으면 시작 지점)에서 다시 시작
  function respawn() {
    const sp = currentCp ? { x: currentCp.x, y: currentCp.y - player.h } : level.start;
    player.x = sp.x;
    player.y = sp.y;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    player.ride = null;
    player.coyote = 0;
    player.facing = 1;
    player.squash = 0;
    jumpPressedAt = -Infinity;
    particles = [];
    trail = [];
    resetCrumbles();
    state = 'playing';
    stateTimer = 0;
    snapCamera();
  }

  // 나락으로 떨어졌을 때: 사망 처리(사망 횟수, GAME OVER) 없이 마지막 체크포인트로 즉시 이동
  function rescue() {
    respawn();
    toastText = 'RESCUED!';
    toastTimer = 1.2;
    flashTimer = 0.35;
    burst(player.x + player.w / 2, player.y + player.h / 2, '#9ad8ff', 24, 260);
  }

  // 이 스테이지를 처음부터 (기록, 사망 횟수, 체크포인트, 발판 상태 초기화)
  function resetGame() {
    level = STAGES[stageIndex].make();
    WORLD_W = STAGES[stageIndex].worldW;
    WORLD_H = STAGES[stageIndex].worldH;
    spikeBoxes = makeSpikeBoxes();
    updateMovers();
    runTime = 0;
    deaths = 0;
    currentCp = null;
    respawn();
    toastText = `STAGE ${stageIndex + 1} · ${STAGES[stageIndex].name}`;
    toastTimer = 2;
  }

  function startStage(i) {
    stageIndex = i;
    save.last = i;
    writeSave();
    closeMenu();
    resetGame();
  }

  function nextStage() {
    if (stageIndex + 1 < STAGES.length) startStage(stageIndex + 1);
    else openMenu();
  }

  // ===================== 유틸 =====================
  const overlap = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 0.7);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - speed * 0.3,
        life: 0.6 + Math.random() * 0.6,
        max: 1.2,
        size: 3 + Math.random() * 4,
        color,
      });
    }
  }

  // 착지/점프 시 발밑 먼지
  function dust(x, y, count) {
    for (let i = 0; i < count; i++) {
      const dir = i % 2 ? 1 : -1;
      particles.push({
        x: x + dir * Math.random() * 8,
        y,
        vx: dir * (40 + Math.random() * 90),
        vy: -40 - Math.random() * 60,
        life: 0.3 + Math.random() * 0.25,
        max: 0.55,
        size: 3 + Math.random() * 3,
        color: 'rgba(210, 200, 230, 0.8)',
      });
    }
  }

  function die() {
    if (state !== 'playing') return;
    shakeTimer = 0.35;
    state = 'dead';
    stateTimer = 0;
    deaths++;
    burst(player.x + player.w / 2, player.y + player.h / 2, '#ffcc4d', 40, 420);
  }

  function clearGame() {
    if (state !== 'playing') return;
    state = 'clear';
    stateTimer = 0;
    const prev = save.best[stageIndex];
    if (prev === undefined || runTime < prev) save.best[stageIndex] = runTime;
    save.unlocked = Math.max(save.unlocked, Math.min(STAGES.length, stageIndex + 2));
    writeSave();
    burst(level.goal.x + level.goal.w / 2, level.goal.y + 10, '#5dff8f', 60, 380);
  }

  // ===================== 물리 업데이트 =====================
  function updatePlayer(dt) {
    const p = player;
    const dir = (isRight() ? 1 : 0) - (isLeft() ? 1 : 0);

    // --- 움직이는 발판에 타 있으면 발판 이동량만큼 같이 이동 ---
    if (p.ride) {
      p.x += p.ride.dx;
      p.y += p.ride.dy;
    }

    // --- 수평 가속 / 마찰 ---
    if (dir !== 0) {
      const accel = p.onGround ? GROUND_ACCEL : AIR_ACCEL;
      // 반대 방향으로 전환할 때는 더 빠르게 멈추도록
      const turnBoost = Math.sign(p.vx) === -dir ? 1.8 : 1;
      p.vx += dir * accel * turnBoost * dt;
      p.vx = clamp(p.vx, -MOVE_SPEED, MOVE_SPEED);
      p.facing = dir;
    } else {
      const fric = (p.onGround ? GROUND_FRICTION : AIR_FRICTION) * dt;
      if (Math.abs(p.vx) <= fric) p.vx = 0;
      else p.vx -= Math.sign(p.vx) * fric;
    }

    // --- 점프 (바닥에 닿아 있을 때만) ---
    if (p.onGround) p.coyote = COYOTE_TIME;
    else p.coyote -= dt;

    const buffered = time - jumpPressedAt <= JUMP_BUFFER;
    if (buffered && p.coyote > 0) {
      p.vy = -JUMP_VELOCITY;
      p.onGround = false;
      p.coyote = 0;
      jumpPressedAt = -Infinity;
      p.squash = -0.25;
      dust(p.x + p.w / 2, p.y + p.h, 6);
    }

    // --- 중력 ---
    let gMul = 1;
    if (p.vy < 0 && !isJumpHeld()) gMul = JUMP_CUT_GRAVITY;
    else if (p.vy > 0) gMul = FALL_GRAVITY;
    p.vy = Math.min(p.vy + GRAVITY * gMul * dt, MAX_FALL);

    // --- X축 이동 및 충돌 ---
    p.x += p.vx * dt;
    for (const s of level.solids) {
      if (overlap(p, s)) {
        if (p.vx > 0) p.x = s.x - p.w;
        else if (p.vx < 0) p.x = s.x + s.w;
        else {
          // 속도 0인데 겹친 경우: 가까운 쪽으로 밀어냄
          const leftPush = p.x + p.w - s.x;
          const rightPush = s.x + s.w - p.x;
          p.x += leftPush < rightPush ? -leftPush : rightPush;
        }
        p.vx = 0;
      }
    }
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > WORLD_W) { p.x = WORLD_W - p.w; p.vx = 0; }

    // --- Y축 이동 및 충돌 ---
    const prevBottom = p.y + p.h;
    const wasOnGround = p.onGround;
    const landingSpeed = p.vy;
    p.y += p.vy * dt;
    p.onGround = false;
    p.ride = null;

    for (const s of level.solids) {
      if (overlap(p, s)) {
        if (p.vy > 0) {
          p.y = s.y - p.h;
          p.onGround = true;
        } else if (p.vy < 0) {
          p.y = s.y + s.h; // 머리 박음
        }
        p.vy = 0;
      }
    }

    // 원웨이 발판: 아래로 떨어지는 중이고, 이전 프레임에 발판 위에 있었을 때만 착지
    if (p.vy >= 0) {
      for (const o of level.oneways) {
        const horizontal = p.x + p.w > o.x && p.x < o.x + o.w;
        if (horizontal && prevBottom <= o.y + 0.5 && p.y + p.h >= o.y) {
          p.y = o.y - p.h;
          p.vy = 0;
          p.onGround = true;
        }
      }
      // 움직이는 발판도 원웨이 방식 (발판이 위로 올라오는 경우를 위해 이전/현재 높이 중 낮은 쪽 기준)
      for (const m of level.movers) {
        const horizontal = p.x + p.w > m.x && p.x < m.x + m.w;
        const top = Math.max(m.y, m.prevY);
        if (horizontal && prevBottom <= top + 1 && p.y + p.h >= m.y) {
          p.y = m.y - p.h;
          p.vy = 0;
          p.onGround = true;
          p.ride = m;
        }
      }
      // 함정 발판: 부서진 상태가 아니면 원웨이 발판과 동일하게 착지, 처음 밟는 순간 붕괴 타이머 시작
      for (const c of level.crumbles) {
        if (c.state === 'broken') continue;
        const horizontal = p.x + p.w > c.x && p.x < c.x + c.w;
        if (horizontal && prevBottom <= c.y + 0.5 && p.y + p.h >= c.y) {
          p.y = c.y - p.h;
          p.vy = 0;
          p.onGround = true;
          if (c.state === 'idle') {
            c.state = 'shaking';
            c.timer = 0;
          }
        }
      }
    }

    if (p.onGround && !wasOnGround && landingSpeed > 300) {
      p.squash = Math.min(0.3, landingSpeed / 3000);
      dust(p.x + p.w / 2, p.y + p.h, Math.min(12, Math.round(landingSpeed / 80)));
    }
    p.squash *= Math.pow(0.001, dt); // 찌그러짐 복원

    if (Math.abs(p.vx) > 200 || Math.abs(p.vy) > 450) {
      trail.push({ x: p.x, y: p.y, life: 0.16 });
    }

    // --- 위험 요소 판정 ---
    for (const l of level.lava) if (overlap(p, l)) return die();
    for (const s of spikeBoxes) if (overlap(p, s)) return die();
    if (p.y > WORLD_H + 60) return rescue();

    // --- 체크포인트 판정 (가장 최근에 닿은 깃발이 부활 지점) ---
    for (const c of level.checkpoints) {
      if (currentCp !== c && overlap(p, checkpointBox(c))) {
        c.active = true;
        currentCp = c;
        toastText = 'CHECKPOINT!';
        toastTimer = 1.6;
        burst(c.x + 12, c.y - CP_H + 10, '#ffe066', 24, 260);
      }
    }

    // --- 도착 판정 ---
    if (overlap(p, level.goal)) clearGame();
  }

  function updateParticles(dt) {
    for (const pt of particles) {
      pt.vy += 900 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
    }
    particles = particles.filter(pt => pt.life > 0);
  }

  function cameraTarget() {
    return {
      x: clamp(player.x + player.w / 2 - VIEW_W / 2 + player.facing * 60, 0, WORLD_W - VIEW_W),
      y: clamp(player.y + player.h / 2 - VIEW_H / 2 - 40, 0, WORLD_H - VIEW_H),
    };
  }
  function snapCamera() {
    const t = cameraTarget();
    camera.x = t.x;
    camera.y = t.y;
  }
  function updateCamera(dt) {
    if (state === 'dead') return; // 죽은 자리에 카메라 고정
    if (state === 'menu') {
      // 메뉴 뒤 배경: 스테이지 전체를 천천히 훑어봄
      const span = Math.max(1, WORLD_W - VIEW_W);
      camera.x = (Math.sin(time * 0.08) * 0.5 + 0.5) * span;
      camera.y = clamp(level.start.y - VIEW_H / 2, 0, WORLD_H - VIEW_H);
      return;
    }
    const t = cameraTarget();
    const k = 1 - Math.pow(0.0005, dt);
    camera.x += (t.x - camera.x) * k;
    camera.y += (t.y - camera.y) * k;
  }

  function update(dt) {
    time += dt;
    stateTimer += dt;
    toastTimer = Math.max(0, toastTimer - dt);
    flashTimer = Math.max(0, flashTimer - dt);
    shakeTimer = Math.max(0, shakeTimer - dt);
    for (const t of trail) t.life -= dt;
    trail = trail.filter(t => t.life > 0);
    for (const e of embers) {
      e.y -= e.vy * dt;
      if (e.y < -10) e.y = VIEW_H + 10;
    }
    updateMovers();
    updateCrumbles(dt);
    if (state === 'playing') {
      runTime += dt;
      updatePlayer(dt);
    }
    updateParticles(dt);
    updateCamera(dt);
  }

  // ===================== 렌더링 =====================
  function drawBackground() {
    // 나락에서 올라오는 붉은 빛이 섞인 밤하늘
    const skyCols = STAGES[stageIndex].sky || ['#0b0820', '#241a4e', '#4e2558', '#7a2e45'];
    const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    sky.addColorStop(0, skyCols[0]);
    sky.addColorStop(0.5, skyCols[1]);
    sky.addColorStop(0.8, skyCols[2]);
    sky.addColorStop(1, skyCols[3]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // 별 (반짝임 + 큰 별은 십자 광채)
    for (let i = 0; i < 90; i++) {
      const sx = ((i * 137.5 - camera.x * 0.04) % VIEW_W + VIEW_W) % VIEW_W;
      const sy = (i * 71.3) % (VIEW_H * 0.6);
      const tw = 0.5 + 0.5 * Math.sin(time * 2 + i);
      ctx.globalAlpha = 0.25 + tw * 0.65;
      ctx.fillStyle = i % 5 === 0 ? '#ffe9c4' : '#ffffff';
      ctx.fillRect(sx, sy, 2, 2);
      if (i % 11 === 0) {
        ctx.globalAlpha *= 0.5;
        ctx.fillRect(sx - 3, sy + 0.5, 8, 1);
        ctx.fillRect(sx + 0.5, sy - 3, 1, 8);
      }
    }
    ctx.globalAlpha = 1;

    // 달
    const mx = VIEW_W * 0.78 - camera.x * 0.02;
    const my = 95 - camera.y * 0.03;
    const halo = ctx.createRadialGradient(mx, my, 20, mx, my, 160);
    halo.addColorStop(0, 'rgba(255, 230, 200, 0.35)');
    halo.addColorStop(1, 'rgba(255, 230, 200, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(mx - 160, my - 160, 320, 320);
    const disc = ctx.createRadialGradient(mx - 10, my - 10, 4, mx, my, 38);
    disc.addColorStop(0, '#fff8e8');
    disc.addColorStop(1, '#e6cfa8');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(mx, my, 36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(160, 130, 100, 0.25)';
    for (const [cx, cy, r] of [[-12, -6, 7], [10, 8, 9], [6, -16, 4], [-6, 16, 5]]) {
      ctx.beginPath();
      ctx.arc(mx + cx, my + cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 원경 산 → 무너진 기둥 폐허 → 근경 언덕 (패럴랙스)
    drawHills(0.1, 330, 110, '#2a1f52', 420);
    drawRuins(0.22, '#20173f');
    drawHills(0.35, 410, 80, '#170f30', 260);

    // 지평선 안개
    const fogY = 380 - camera.y * 0.2;
    const fog = ctx.createLinearGradient(0, fogY - 60, 0, fogY + 80);
    fog.addColorStop(0, 'rgba(180, 90, 140, 0)');
    fog.addColorStop(0.5, 'rgba(180, 90, 140, 0.18)');
    fog.addColorStop(1, 'rgba(180, 90, 140, 0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, fogY - 60, VIEW_W, 140);
  }

  function drawRuins(factor, color) {
    const span = bgRuins.length * 170;
    const baseY = 470 - camera.y * factor * 0.5;
    ctx.fillStyle = color;
    for (const r of bgRuins) {
      const x = ((r.x - camera.x * factor) % span + span) % span - 100;
      if (x > VIEW_W + 50 || x + r.w < -50) continue;
      const top = baseY - r.h;
      ctx.fillRect(x, top, r.w, r.h + 200);
      if (r.broken) {
        // 부러진 기둥: 들쭉날쭉한 윗부분
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x + r.w * 0.3, top - 14);
        ctx.lineTo(x + r.w * 0.55, top - 4);
        ctx.lineTo(x + r.w * 0.8, top - 20);
        ctx.lineTo(x + r.w, top);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(x - 6, top - 10, r.w + 12, 10); // 기둥머리
      }
    }
  }

  // 화면 앞쪽에서 떠오르는 불씨 (약한 패럴랙스)
  function drawEmbers() {
    ctx.globalCompositeOperation = 'lighter';
    const span = VIEW_W * 1.6;
    for (const e of embers) {
      const x = ((e.x - camera.x * 0.6 + Math.sin(time + e.ph) * 12) % span + span) % span - VIEW_W * 0.3;
      const flicker = 0.4 + 0.4 * Math.sin(time * 5 + e.ph);
      ctx.fillStyle = `rgba(255, ${120 + (e.ph % 5) * 20}, 60, ${flicker * 0.7})`;
      ctx.fillRect(x, e.y, e.size, e.size);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.35, VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.75);
    v.addColorStop(0, 'rgba(0, 0, 0, 0)');
    v.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  function drawHills(factor, baseY, amp, color, period) {
    const offX = camera.x * factor;
    const offY = camera.y * factor * 0.5;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VIEW_H);
    for (let x = 0; x <= VIEW_W; x += 16) {
      const wx = x + offX;
      const y = baseY - offY + 40 - Math.abs(Math.sin(wx / period)) * amp - Math.sin(wx / (period * 0.37)) * amp * 0.2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VIEW_W, VIEW_H);
    ctx.closePath();
    ctx.fill();
  }

  function drawSolids() {
    for (const s of level.solids) {
      ctx.fillStyle = '#5a4636';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      // 잔디 윗면
      ctx.fillStyle = '#58c26a';
      ctx.fillRect(s.x, s.y, s.w, 8);
      ctx.fillStyle = '#3f9a52';
      ctx.fillRect(s.x, s.y + 8, s.w, 3);
      // 흙 무늬
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      for (let x = s.x + 10; x < s.x + s.w - 6; x += 28) {
        for (let y = s.y + 22; y < s.y + s.h - 4; y += 22) {
          ctx.fillRect(x + ((y / 22) % 2) * 12, y, 6, 4);
        }
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
    }
  }

  function drawOneways() {
    for (const o of level.oneways) {
      ctx.fillStyle = '#c99a5b';
      ctx.fillRect(o.x, o.y, o.w, 12);
      ctx.fillStyle = '#e6bb7a';
      ctx.fillRect(o.x, o.y, o.w, 4);
      ctx.fillStyle = '#8a6333';
      for (let x = o.x + 6; x < o.x + o.w - 4; x += 24) ctx.fillRect(x, o.y + 5, 3, 7);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, 11);
    }
  }

  function drawMovers() {
    for (const m of level.movers) {
      // 이동 경로 레일
      ctx.strokeStyle = 'rgba(180, 200, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(m.bx - m.ax + m.w / 2, m.by - m.ay + 6);
      ctx.lineTo(m.bx + m.ax + m.w / 2, m.by + m.ay + 6);
      ctx.stroke();
      ctx.setLineDash([]);

      // 발판 본체 (금속 느낌)
      ctx.fillStyle = '#6c7bd9';
      ctx.fillRect(m.x, m.y, m.w, 12);
      ctx.fillStyle = '#a9b4ff';
      ctx.fillRect(m.x, m.y, m.w, 4);
      ctx.fillStyle = '#ffe066';
      for (let x = m.x + 8; x < m.x + m.w - 6; x += 18) ctx.fillRect(x, m.y + 6, 6, 3);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(m.x + 1, m.y + 1, m.w - 2, 11);
    }
  }

  const CRUMBLE_STONE = [154, 143, 134];
  const CRUMBLE_RED = [224, 58, 58];
  const mixColor = (a, b, t) =>
    `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;

  function drawCrumbles() {
    for (const c of level.crumbles) {
      if (c.state === 'broken') {
        // 복구 직전 0.6초 동안 자리 표시가 깜빡임
        if (c.timer > CRUMBLE_RESTORE - 0.6) {
          ctx.globalAlpha = 0.25 + 0.25 * Math.sin(time * 30);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.strokeRect(c.x + 1, c.y + 1, c.w - 2, 11);
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
        continue;
      }
      // 밟힌 뒤 진행도(0→1)에 따라 점점 붉어지고 더 세게 흔들림
      const t = c.state === 'shaking' ? Math.min(1, c.timer / CRUMBLE_DELAY) : 0;
      const sx = c.state === 'shaking' ? Math.sin(time * 70) * (1 + t * 2) : 0;
      const x = c.x + sx;
      ctx.shadowColor = 'rgba(255, 60, 60, 0.9)';
      ctx.shadowBlur = 24 * t;
      ctx.fillStyle = mixColor(CRUMBLE_STONE, CRUMBLE_RED, t);
      ctx.fillRect(x, c.y, c.w, 12);
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(255,255,255,${0.25 + t * 0.2})`;
      ctx.fillRect(x, c.y, c.w, 3);
      // 금 간 무늬
      ctx.strokeStyle = 'rgba(40,20,20,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let cx = x + 18; cx < x + c.w - 8; cx += 30) {
        ctx.moveTo(cx, c.y + 2);
        ctx.lineTo(cx + 5, c.y + 7);
        ctx.lineTo(cx - 2, c.y + 12);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, c.y + 1, c.w - 2, 11);
    }
  }

  // 나락 구간: 바닥 쪽으로 갈수록 어두워지는 안개
  function drawAbyss() {
    for (const a of level.abyss) {
      const grad = ctx.createLinearGradient(0, WORLD_H - 160, 0, WORLD_H);
      grad.addColorStop(0, 'rgba(8, 4, 20, 0)');
      grad.addColorStop(1, 'rgba(8, 4, 20, 0.9)');
      ctx.fillStyle = grad;
      ctx.fillRect(a.x, WORLD_H - 160, a.w, 160);
      // 일렁이는 안개 띠
      ctx.fillStyle = 'rgba(120, 70, 170, 0.12)';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(a.x, WORLD_H);
        for (let x = a.x; x <= a.x + a.w; x += 20) {
          ctx.lineTo(x, WORLD_H - 50 - k * 25 + Math.sin(x / 70 + time * (0.8 + k * 0.4) + k) * 12);
        }
        ctx.lineTo(a.x + a.w, WORLD_H);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  function drawCheckpoints() {
    for (const c of level.checkpoints) {
      const poleX = c.x + 10;
      const top = c.y - CP_H;
      if (c === currentCp) {
        const glow = ctx.createRadialGradient(poleX, top + 12, 2, poleX, top + 12, 40);
        glow.addColorStop(0, 'rgba(255, 224, 102, 0.45)');
        glow.addColorStop(1, 'rgba(255, 224, 102, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(poleX - 40, top - 28, 80, 80);
      }
      // 받침돌
      ctx.fillStyle = '#6b6f80';
      ctx.fillRect(c.x + 2, c.y - 6, 20, 6);
      // 깃대
      ctx.fillStyle = '#d8d8e0';
      ctx.fillRect(poleX, top, 4, CP_H - 6);
      // 깃발 (비활성: 회색 / 활성: 노란색으로 펄럭임)
      const wave = c.active ? Math.sin(time * 7) * 3 : 0;
      ctx.fillStyle = c.active ? '#ffe066' : '#8a8fa3';
      ctx.beginPath();
      ctx.moveTo(poleX + 4, top);
      ctx.quadraticCurveTo(poleX + 16, top + 5 + wave, poleX + 28, top + 9);
      ctx.quadraticCurveTo(poleX + 16, top + 14 - wave, poleX + 4, top + 20);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawSpikes() {
    for (const s of level.spikes) {
      const n = Math.max(1, Math.round(s.w / 20));
      const tw = s.w / n;
      for (let i = 0; i < n; i++) {
        const x0 = s.x + i * tw;
        ctx.beginPath();
        ctx.moveTo(x0, s.y);
        ctx.lineTo(x0 + tw / 2, s.y - SPIKE_H);
        ctx.lineTo(x0 + tw, s.y);
        ctx.closePath();
        ctx.shadowColor = 'rgba(255, 60, 60, 0.6)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#e03a3a';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#7a1414';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // 하이라이트
        ctx.beginPath();
        ctx.moveTo(x0 + tw / 2, s.y - SPIKE_H + 3);
        ctx.lineTo(x0 + tw * 0.35, s.y - 3);
        ctx.strokeStyle = 'rgba(255,200,200,0.6)';
        ctx.stroke();
      }
    }
  }

  function drawLava() {
    for (const l of level.lava) {
      ctx.globalCompositeOperation = 'lighter';
      const light = ctx.createLinearGradient(0, l.y - 140, 0, l.y + 10);
      light.addColorStop(0, 'rgba(255, 90, 20, 0)');
      light.addColorStop(1, `rgba(255, 90, 20, ${0.22 + 0.06 * Math.sin(time * 3 + l.x)})`);
      ctx.fillStyle = light;
      ctx.fillRect(l.x - 20, l.y - 140, l.w + 40, 150);
      ctx.globalCompositeOperation = 'source-over';

      const grad = ctx.createLinearGradient(0, l.y, 0, l.y + l.h);
      grad.addColorStop(0, '#ff6a1f');
      grad.addColorStop(1, '#b3160c');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(l.x, l.y + l.h);
      for (let x = l.x; x <= l.x + l.w; x += 8) {
        const y = l.y + Math.sin(x / 22 + time * 3) * 3 + Math.sin(x / 9 - time * 5) * 1.5;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(l.x + l.w, l.y + l.h + 60);
      ctx.lineTo(l.x, l.y + l.h + 60);
      ctx.closePath();
      ctx.fill();
      // 빛나는 표면
      ctx.fillStyle = 'rgba(255, 220, 90, 0.5)';
      for (let x = l.x + 10; x < l.x + l.w - 10; x += 37) {
        const bob = Math.sin(time * 2 + x) * 3;
        ctx.fillRect(x, l.y + 8 + bob, 10, 3);
      }
    }
  }

  function drawGoal() {
    const g = level.goal;
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    // 빛 기둥
    const glow = ctx.createRadialGradient(g.x + g.w / 2, g.y + g.h / 2, 5, g.x + g.w / 2, g.y + g.h / 2, 90);
    glow.addColorStop(0, `rgba(93, 255, 143, ${0.35 + pulse * 0.2})`);
    glow.addColorStop(1, 'rgba(93, 255, 143, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(g.x - 90, g.y - 90, g.w + 180, g.h + 180);

    // 포털 본체
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.fillStyle = '#a8ffc4';
    ctx.fillRect(g.x + 6, g.y + 6, g.w - 12, g.h - 12);
    ctx.fillStyle = `rgba(46, 204, 113, ${0.4 + pulse * 0.4})`;
    ctx.fillRect(g.x + 10, g.y + 10, g.w - 20, g.h - 20);

    // 깃발
    ctx.fillStyle = '#ddd';
    ctx.fillRect(g.x + g.w + 14, g.y - 50, 4, g.h + 50);
    const wave = Math.sin(time * 6) * 4;
    ctx.fillStyle = '#5dff8f';
    ctx.beginPath();
    ctx.moveTo(g.x + g.w + 18, g.y - 50);
    ctx.quadraticCurveTo(g.x + g.w + 40, g.y - 44 + wave, g.x + g.w + 58, g.y - 38);
    ctx.quadraticCurveTo(g.x + g.w + 40, g.y - 30 - wave, g.x + g.w + 18, g.y - 26);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#eafff0';
    ctx.font = 'bold 14px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GOAL', g.x + g.w / 2, g.y - 10);
  }

  function drawPlayer() {
    if (state === 'dead') return;
    const p = player;
    const sq = p.squash;
    const w = p.w * (1 + sq);
    const h = p.h * (1 - sq);
    const x = p.x + (p.w - w) / 2;
    const y = p.y + (p.h - h);

    // 어두운 배경에서도 잘 보이도록 은은한 주변광
    ctx.globalCompositeOperation = 'lighter';
    const skin = curSkin();
    const aura = ctx.createRadialGradient(p.x + p.w / 2, p.y + p.h / 2, 4, p.x + p.w / 2, p.y + p.h / 2, 70);
    ctx.globalAlpha = 0.25;
    aura.addColorStop(0, skin.body);
    aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = aura;
    ctx.fillRect(p.x - 60, p.y - 60, p.w + 120, p.h + 120);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // 잔상
    for (const t of trail) {
      ctx.globalAlpha = (t.life / 0.16) * 0.25;
      ctx.fillStyle = skin.body;
      roundRect(t.x, t.y, p.w, p.h, 6);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawCharacter(ctx, x, y, w, h, p.facing, time % 3.4 < 0.12, skin, save.pattern);
  }

  const roundRect = (x, y, w, h, r) => rr(ctx, x, y, w, h, r);

  function drawParticles() {
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
  }

  function formatTime(t) {
    const m = Math.floor(t / 60);
    const s = (t % 60).toFixed(2).padStart(5, '0');
    return `${m}:${s}`;
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(12, 12, 250, 62, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.fillText(`⏱ ${formatTime(runTime)}`, 24, 38);
    ctx.fillText(`☠ ${deaths}`, 150, 38);
    ctx.font = '13px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const best = save.best[stageIndex];
    ctx.fillText(`STAGE ${stageIndex + 1}  ·  최고 ${best !== undefined ? formatTime(best) : '--:--'}`, 24, 62);

    // 진행도 바 (시작 지점 → 도착 지점까지 남은 거리 기준, 세로 스테이지에서도 동작)
    const gx = level.goal.x + level.goal.w / 2, gy = level.goal.y + level.goal.h / 2;
    const total = Math.hypot(gx - level.start.x, gy - level.start.y);
    const prog = clamp(1 - Math.hypot(gx - player.x, gy - player.y) / total, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(VIEW_W - 232, 16, 216, 14, 7);
    ctx.fill();
    ctx.fillStyle = '#5dff8f';
    roundRect(VIEW_W - 230, 18, Math.max(10, 212 * prog), 10, 5);
    ctx.fill();

    // 체크포인트 알림
    if (toastTimer > 0) {
      ctx.globalAlpha = Math.min(1, toastTimer / 0.4);
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px "Segoe UI", sans-serif';
      ctx.fillStyle = '#7a5a00';
      ctx.fillText(toastText, VIEW_W / 2 + 2, 92);
      ctx.fillStyle = '#ffe066';
      ctx.fillText(toastText, VIEW_W / 2, 90);
      ctx.globalAlpha = 1;
    }

    // 조작법 (처음 몇 초간)
    if (state === 'playing' && runTime < 6) {
      ctx.globalAlpha = Math.min(1, (6 - runTime) / 1.5);
      ctx.textAlign = 'center';
      ctx.font = '16px "Segoe UI", "Malgun Gothic", sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      roundRect(VIEW_W / 2 - 290, VIEW_H - 58, 580, 36, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(isTouch
        ? '◀ ▶ : 이동    점프 : 길게 누르면 높이    ↺ : 다시    ☰ : 메뉴'
        : '← → / A D : 이동    Space / ↑ / W : 점프    R : 다시    Esc : 메뉴', VIEW_W / 2, VIEW_H - 34);
      ctx.globalAlpha = 1;
    }
  }

  function drawOverlay() {
    if (state === 'playing' || state === 'menu') return;
    const a = Math.min(1, stateTimer / 0.4);
    ctx.fillStyle = `rgba(5, 6, 15, ${0.6 * a})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';

    const bounce = Math.sin(time * 3) * 4;
    if (state === 'dead') {
      ctx.font = 'bold 72px "Segoe UI", sans-serif';
      ctx.fillStyle = '#7a1414';
      ctx.fillText('GAME OVER', VIEW_W / 2 + 4, VIEW_H / 2 - 16 + 4 + bounce);
      ctx.fillStyle = '#ff4d4d';
      ctx.fillText('GAME OVER', VIEW_W / 2, VIEW_H / 2 - 16 + bounce);
    } else {
      ctx.font = 'bold 72px "Segoe UI", sans-serif';
      ctx.fillStyle = '#146b35';
      const title = stageIndex + 1 < STAGES.length ? 'STAGE CLEAR!' : 'ALL CLEAR!';
      ctx.fillText(title, VIEW_W / 2 + 4, VIEW_H / 2 - 30 + 4 + bounce);
      ctx.fillStyle = '#5dff8f';
      ctx.fillText(title, VIEW_W / 2, VIEW_H / 2 - 30 + bounce);
      ctx.font = '22px "Segoe UI", "Malgun Gothic", sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(`기록 ${formatTime(runTime)}   ·   사망 ${deaths}회`, VIEW_W / 2, VIEW_H / 2 + 14);
    }

    ctx.font = '20px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.45 * Math.sin(time * 4)})`;
    let msg;
    if (state === 'dead') {
      const where = currentCp ? '체크포인트에서' : '처음부터';
      msg = isTouch ? `터치: ${where} 다시 시작   ·   ↺: 처음부터` : `Enter: ${where} 다시 시작   ·   R: 처음부터`;
    } else if (stageIndex + 1 < STAGES.length) {
      msg = isTouch ? '터치: 다음 스테이지   ·   ☰: 메뉴' : 'Enter: 다음 스테이지   ·   Esc: 메뉴';
    } else {
      msg = isTouch ? '모든 스테이지 클리어! 터치해서 메뉴로' : '모든 스테이지 클리어!   Enter: 메뉴로';
    }
    ctx.fillText(msg, VIEW_W / 2, VIEW_H / 2 + 60);
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    drawBackground();

    const shake = shakeTimer > 0 ? shakeTimer * 30 : 0;
    const shx = (Math.random() - 0.5) * shake;
    const shy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(-Math.round(camera.x + shx), -Math.round(camera.y + shy));
    drawLava();
    drawAbyss();
    drawSolids();
    drawOneways();
    drawCrumbles();
    drawMovers();
    drawCheckpoints();
    drawSpikes();
    drawGoal();
    drawPlayer();
    drawParticles();
    ctx.restore();
    drawEmbers();
    drawVignette();

    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(255,255,255,${(flashTimer / 0.35) * 0.6})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    if (state !== 'menu') drawHUD();
    drawOverlay();
    if (state === 'menu') drawPreview();
  }

  // ===================== 메인 메뉴 =====================
  const menuEl = document.getElementById('menu');
  const previewEl = document.getElementById('preview');
  const previewCtx = previewEl.getContext('2d');
  const swatchesEl = document.getElementById('swatches');
  const patternsEl = document.getElementById('patterns');
  const stageListEl = document.getElementById('stageList');

  SKINS.forEach((sk, i) => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = sk.body;
    b.title = sk.name;
    b.setAttribute('aria-label', sk.name);
    b.addEventListener('click', () => { save.skin = i; writeSave(); refreshMenu(); });
    swatchesEl.appendChild(b);
  });
  PATTERNS.forEach(pt => {
    const b = document.createElement('button');
    b.className = 'pat';
    b.dataset.id = pt.id;
    b.innerHTML = `<canvas width="68" height="68"></canvas><span>${pt.name}</span>`;
    b.addEventListener('click', () => { save.pattern = pt.id; writeSave(); refreshMenu(); });
    patternsEl.appendChild(b);
  });

  function refreshMenu() {
    [...swatchesEl.children].forEach((b, i) => b.classList.toggle('sel', i === save.skin));
    for (const b of patternsEl.children) {
      b.classList.toggle('sel', b.dataset.id === save.pattern);
      const c = b.querySelector('canvas').getContext('2d');
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 68, 68);
      c.setTransform(1.4, 0, 0, 1.4, 0, 0);
      drawCharacter(c, 10.3, 5, 28, 36, 1, false, curSkin(), b.dataset.id);
    }
    stageListEl.innerHTML = '';
    STAGES.forEach((st, i) => {
      const locked = i >= save.unlocked;
      const best = save.best[i];
      const b = document.createElement('button');
      b.className = 'stage';
      b.disabled = locked;
      b.innerHTML = `<span class="num">${locked ? '🔒' : i + 1}</span>`
        + `<span class="name">${st.name}</span>`
        + `<span class="best">${locked ? '이전 스테이지를 깨면 열려요' : best !== undefined ? '최고 ' + formatTime(best) : '도전 전'}</span>`;
      b.addEventListener('click', () => startStage(i));
      stageListEl.appendChild(b);
    });
    document.getElementById('menuHint').textContent = isTouch
      ? '스테이지를 눌러서 시작'
      : '스테이지를 클릭하거나 Enter로 시작  ·  게임 중 Esc로 메뉴';
  }

  // 미리보기 캐릭터: 좌우를 번갈아 보고 가끔 깜빡이며 통통 튐
  function drawPreview() {
    const dpr = window.devicePixelRatio || 1;
    const size = Math.round(96 * dpr);
    if (previewEl.width !== size) { previewEl.width = size; previewEl.height = size; }
    const c = previewCtx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, size, size);
    const k = (96 / 48) * dpr;
    c.setTransform(k, 0, 0, k, 0, 0);
    const hop = Math.abs(Math.sin(time * 3)) * 4;
    c.fillStyle = 'rgba(0, 0, 0, 0.3)';
    c.beginPath();
    c.ellipse(24, 44, 13 - hop, 2.5, 0, 0, Math.PI * 2);
    c.fill();
    const facing = Math.sin(time * 0.9) > 0 ? 1 : -1;
    drawCharacter(c, 10, 6 - hop, 28, 36, facing, time % 3.4 < 0.12, curSkin(), save.pattern);
  }

  function openMenu() {
    state = 'menu';
    keys.clear();
    for (const id of [...fingers.keys()]) setFinger(id, null);
    document.body.classList.add('menu-open');
    menuEl.hidden = false;
    refreshMenu();
  }

  function closeMenu() {
    menuEl.hidden = true;
    document.body.classList.remove('menu-open');
  }

  // ===================== 메인 루프 =====================
  let last = performance.now();
  let acc = 0;
  function loop(now) {
    const frame = Math.min(0.1, (now - last) / 1000); // 탭 전환 등으로 인한 큰 dt 방지
    last = now;
    acc += frame;
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }

  stageIndex = clamp(Math.min(save.last | 0, (save.unlocked | 0) - 1), 0, STAGES.length - 1);
  resetGame();          // 메뉴 뒤에 보일 스테이지를 미리 불러옴
  openMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
